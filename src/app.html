<!doctype html>
<html lang="%lang%" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07131d" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <script>
      // Apply the saved palette before CSS paints; the full application takes
      // over after hydration. Storage failures must never block the document.
      try {
        const preferences = JSON.parse(localStorage.getItem('modding-guide:preferences:v1') || '{}');
        if (preferences.theme === 'light') document.documentElement.dataset.theme = 'light';
      } catch {}
    </script>
    <noscript>
      <style>
        @media (max-width: 1200px) {
          .sidebar { position: static !important; width: 100% !important; transform: none !important; }
          .sidebar-scroll { position: static !important; max-height: none !important; }
          .menu-button, .mobile-search-row { display: none !important; }
        }
      </style>
    </noscript>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="tap">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
